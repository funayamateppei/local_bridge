plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.0'
	id 'io.spring.dependency-management' version '1.1.6'
	id 'com.diffplug.spotless' version '6.25.0'
	id 'org.jetbrains.kotlin.jvm' version '1.9.25'
	id 'org.jetbrains.kotlin.plugin.spring' version '1.9.25'
	id 'org.jetbrains.kotlin.plugin.jpa' version '1.9.25'
    id 'org.flywaydb.flyway' version '9.22.0'
}

group = 'com.localbridge'
version = '0.0.1-SNAPSHOT'
description = 'Local Bridge Backend'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

// 自動でJDKをダウンロードするための設定
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}


configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'com.fasterxml.jackson.module:jackson-module-kotlin'
	implementation 'org.jetbrains.kotlin:kotlin-reflect'
	implementation 'com.auth0:java-jwt:4.4.0'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.jetbrains.kotlin:kotlin-test-junit5'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testImplementation 'org.springframework.security:spring-security-test'
	implementation 'me.paulschwarz:spring-dotenv:4.0.0'
}

compileKotlin {
	kotlinOptions {
		freeCompilerArgs = ['-Xjsr305=strict']
		jvmTarget = '21'
	}
}

compileTestKotlin {
	kotlinOptions {
		freeCompilerArgs = ['-Xjsr305=strict']
		jvmTarget = '21'
	}
}

tasks.named('test') {
	useJUnitPlatform()
}

spotless {
	java {
		googleJavaFormat()
	}
}

tasks.register('format') {
	dependsOn 'spotlessApply'
}

tasks.register('lint') {
	dependsOn 'spotlessCheck'
}


flyway {
    url = System.getenv('DB_URL') ?: 'jdbc:postgresql://localhost:5432/local_bridge'
    user = System.getenv('DB_USERNAME') ?: 'postgres'
    password = System.getenv('DB_PASSWORD') ?: 'postgres'
    locations = ['filesystem:src/main/resources/db/migration']
}

import java.time.LocalDateTime
import java.time.format.DateTimeFormatter

task flywayCreate {
    description = "Create a Flyway migration file with proper naming."
    group = "flyway"

    doLast {
        def desc = project.findProperty('migrationDesc')
        if (!desc) {
            throw new GradleException("Please provide -PmigrationDesc=<YourDescription>")
        }

        def migrationDir = file('src/main/resources/db/migration')
        if (!migrationDir.exists()) migrationDir.mkdirs()

        def existing = migrationDir.listFiles()
                .findAll { it.name ==~ /V\\d+__.*\\.sql/ }
                .collect { it.name.replaceAll(/V(\\d+)__.*/, '$1') as int }

        def nextVersion = (existing.empty ? 1 : existing.max() + 1)

        def formattedDesc = desc.replaceAll(/\\s+/, '_')
                .replaceAll(/[^A-Za-z0-9_]/, '')
                .toLowerCase()
        def fileName = "V${nextVersion}__${formattedDesc}.sql"
        def file = new File(migrationDir, fileName)

        file.text = "-- Write your SQL migration here\n"

        println "Created migration: ${file}"
    }
}
